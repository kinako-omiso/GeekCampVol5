<style>
body{margin:0;background:#8FDBFF}
.mp{font-family:'Mochiy Pop One',sans-serif;line-height:1.05}
.ol-m{-webkit-text-stroke:10px #231A3D;paint-order:stroke fill}
.ol-s{-webkit-text-stroke:6px #231A3D;paint-order:stroke fill}
@keyframes blink{0%,100%{opacity:.35}50%{opacity:1}}
.danger{animation:blink .6s ease-in-out infinite}
@keyframes march{to{stroke-dashoffset:-60}}
.march{animation:march 1s linear infinite}
@keyframes puff{0%,100%{transform:scale(.85);opacity:.75}50%{transform:scale(1.12);opacity:1}}
.puff{animation:puff 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes inward{0%{transform:translateX(-8px);opacity:.55}60%{transform:translateX(10px);opacity:1}100%{transform:translateX(-8px);opacity:.55}}
.inward{animation:inward .9s ease-in-out infinite}
@keyframes hitflash{0%,8%{opacity:.95}14%,100%{opacity:0}}
.hitflash{animation:hitflash 1.4s linear infinite}
@keyframes pop{0%{transform:scale(.5)}10%{transform:scale(1.14)}18%,100%{transform:scale(1)}}
.pop{transform-box:fill-box;transform-origin:center;animation:pop 1.4s cubic-bezier(.2,1.6,.4,1) infinite}
@keyframes popText{0%{transform:scale(.4) rotate(-10deg)}10%{transform:scale(1.15) rotate(-10deg)}18%,100%{transform:scale(1) rotate(-10deg)}}
.popText{animation:popText 1.4s cubic-bezier(.2,1.6,.4,1) infinite}
@keyframes orbit{to{transform:rotate(360deg)}}
.orbit{animation:orbit 1.6s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes sunspin{to{transform:rotate(360deg)}}
.sunspin{animation:sunspin 20s linear infinite}
@keyframes pill{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.pill{animation:pill .6s ease-in-out infinite}
@keyframes trail{0%,50%{opacity:1}51%,100%{opacity:.3}}
.trail{animation:trail .3s steps(1,end) infinite}
.hud{position:absolute;top:14px;width:520px;height:104px;display:flex;align-items:center;gap:14px}
.portrait{width:96px;height:96px;box-sizing:border-box;border-radius:50%;background:#FFF8EC;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.bar{height:34px;box-sizing:border-box;border:5px solid #231A3D;border-radius:999px;background:#FFF8EC;overflow:hidden;display:flex;box-shadow:0 5px 0 #231A3D}
.chip{padding:2px 14px 5px;border:4px solid #231A3D;border-radius:12px;font-size:26px;color:#ffffff}
</style>
</helmet>
