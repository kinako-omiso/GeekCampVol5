.mp{font-family:'Mochiy Pop One',sans-serif;line-height:1.05}

.rays{animation:rays 40s linear infinite}

.drift{animation:drift 40s linear infinite}

.squash{animation:squash 6s ease-out infinite;transform-origin:50% 92%}
@keyframes lines{0%,16%{opacity:1}19%,100%{opacity:0}}
.lines{animation:lines 6s linear infinite}
@keyframes eyeShut{0%,29%{opacity:1}30%,100%{opacity:0}}

@keyframes eyeOpen{0%,29%{opacity:0;transform:scaleY(.1)}32%{opacity:1;transform:scaleY(1.3)}34%,70%{opacity:1;transform:scaleY(1)}71%{transform:scaleY(.1)}72.5%,100%{opacity:1;transform:scaleY(1)}}

.stripes{animation:stripes 1.2s linear infinite}

.deb{position:absolute;left:317px;top:515px;animation:deb 6s cubic-bezier(.2,.7,.4,1) infinite}

@keyframes tw{0%,100%{transform:scale(.2) rotate(0)}50%{transform:scale(1) rotate(90deg)}}

.lbl{font-size:20px;font-weight:900}

<div class="col badgeIn"><div class="badge" style="border:8px solid {{pc}}"><svg viewBox="0 0 24 24" width="56" height="56" fill="#231A3D" aria-hidden="true"><use href="#i-pow"/></svg></div><svg viewBox="0 0 150 30" width="140" height="28" role="img" aria-label="パワー"><use href="#{{pow}}"/></svg><div class="lbl">パワー</div></div>
<div class="col badgeIn" style="animation-delay:.25s"><div class="badge" style="border:8px solid {{pc}}"><svg viewBox="0 0 24 24" width="56" height="56" fill="none" stroke="#231A3D" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-reach"/></svg></div><svg viewBox="0 0 150 30" width="140" height="28" role="img" aria-label="リーチ"><use href="#{{reach}}"/></svg><div class="lbl">リーチ</div></div>
<div class="col badgeIn" style="animation-delay:.5s"><div class="badge" style="border:8px solid {{pc}}"><svg viewBox="0 0 24 24" width="56" height="56" fill="#231A3D" aria-hidden="true"><use href="#i-speed"/></svg></div><svg viewBox="0 0 150 30" width="140" height="28" role="img" aria-label="スピード"><use href="#{{spd}}"/></svg><div class="lbl">スピード</div></div>
</div>

<div style="position:absolute;left:720px;top:500px;width:540px;display:flex;justify-content:center">
<div class="mp ribbonIn" style="position:relative;overflow:hidden;padding:18px 48px 22px;background:#FFC93C;border:7px solid #231A3D;border-radius:20px;box-shadow:0 9px 0 #231A3D;font-size:54px;white-space:nowrap">{{typeName}}<span class="shine" style="position:absolute;top:-10px;bottom:-10px;left:-120px;width:70px;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.9),rgba(255,255,255,0))"></span></div>
</div>
</div>
</div>

<div class="flash" style="position:absolute;inset:0;background:#ffffff"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"player":{"editor":"enum","options":["1P","2P"],"default":"1P"},"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    const p2 = (this.props.player ?? '1P') === '2P';
    return {
      isP1: !p2,
      isP2: p2,
      label: p2 ? '2P' : '1P',
      pc: p2 ? '#E8284F' : '#2F6BFF',
      pcL: p2 ? '#FFA3B8' : '#9CC0FF',
      pcA: p2 ? 'rgba(232,40,79,.2)' : 'rgba(47,107,255,.2)',
      bandA: p2 ? '#FF97AE' : '#8FB4FF',
      bandB: p2 ? '#FFB1C2' : '#A9C6FF',
      typeName: p2 ? 'スピードタイプ!' : 'パワータイプ!',
      pow: p2 ? 'stars2' : 'stars4',
      reach: p2 ? 'stars4' : 'stars3',
      spd: p2 ? 'stars5' : 'stars2'
    };
  }
}
</script>
</body>
</html>
