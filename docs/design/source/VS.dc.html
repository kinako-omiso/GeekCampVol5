body{margin:0;background:#8FDBFF}
.mp{font-family:'Mochiy Pop One',sans-serif;line-height:1.05}

@keyframes drift{from{transform:translateX(0)}to{transform:translateX(1700px)}}
.drift{animation:drift 14s linear infinite}

@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}

@keyframes scrim{0%,53%{opacity:0}56%,95%{opacity:.5}100%{opacity:0}}
.scrim{animation:scrim 7s linear infinite}
@keyframes c3{0%,54%{opacity:0;transform:scale(2.2)}56%{opacity:1;transform:scale(.94)}58%,64%{opacity:1;transform:scale(1)}66%,100%{opacity:0;transform:scale(.6)}}

.c3{animation:c3 7s ease-out infinite}.c2{animation:c2 7s ease-out infinite}.c1{animation:c1 7s ease-out infinite}.go{animation:go 7s ease-out infinite}
@keyframes wave{0%,100%{transform:skewY(0deg)}50%{transform:skewY(-5deg)}}
.wave{animation:wave 1s ease-in-out infinite;transform-origin:15% 50%}
@keyframes tw{0%,100%{transform:scale(0) rotate(0)}50%{transform:scale(1) rotate(90deg)}}
.tw{animation:tw 1.1s ease-in-out infinite}
