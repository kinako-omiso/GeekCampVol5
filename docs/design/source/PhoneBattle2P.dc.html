<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>スマホ 対戦 2P</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&amp;family=M+PLUS+Rounded+1c:wght@500;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#231A3D}
.mp{font-family:'Mochiy Pop One',sans-serif;line-height:1.05}
.ol{-webkit-text-stroke:14px #231A3D;paint-order:stroke fill}
.pad{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-sizing:border-box;border:7px solid #231A3D;border-radius:36px;box-shadow:0 10px 0 #231A3D;cursor:pointer;padding:0;font-family:inherit;color:#231A3D;transition:transform .08s,box-shadow .08s}
.pressed{transform:translateY(8px);box-shadow:0 2px 0 #231A3D}
.sub{position:relative;display:flex;align-items:center;gap:8px;font-size:30px;font-weight:900}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin 12s linear infinite}
@keyframes ready{0%{box-shadow:inset 0 0 0 0 rgba(255,255,255,.95)}100%{box-shadow:inset 0 0 0 44px rgba(255,255,255,0)}}
.ready{animation:ready .6s ease-out both}
@keyframes hit{0%,6%{opacity:.95}10%,100%{opacity:0}}
.hit{animation:hit 1.5s linear infinite;pointer-events:none}
</style>
</helmet>
<div style="width:844px;height:390px;position:relative;overflow:hidden;background-color:{{pc}};font-family:'M PLUS Rounded 1c',sans-serif;color:#ffffff">
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="burstW" viewBox="-120 -120 240 240"><polygon points="0,-100 14.2,-53.1 42,-72.7 38.9,-38.9 93.5,-54 53.1,-14.2 90,0 53.1,14.2 88.3,51 38.9,38.9 43,74.5 14.2,53.1 0,110 -14.2,53.1 -44,76.2 -38.9,38.9 -84.9,49 -53.1,14.2 -82,0 -53.1,-14.2 -91.8,-53 -38.9,-38.9 -46,-79.7 -14.2,-53.1" fill="#FFE27A"/></symbol>
<symbol id="cloudFlat" viewBox="0 0 160 80"><path d="M24 74C8 74 3 54 17 47C13 29 35 20 48 30C54 11 85 7 95 26C107 16 129 22 129 41C147 41 156 62 141 74Z" fill="#ffffff"/></symbol>
<symbol id="i-tilt" viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="9.5" rx="2.2" transform="rotate(-15 12 12.75)"/><path d="M5 5.5A10 10 0 0 1 12 3"/><path d="M19 19.5A10 10 0 0 1 12 22"/></symbol>
<symbol id="i-signal" viewBox="0 0 24 24"><path d="M5 19v-3"/><path d="M10 19v-7"/><path d="M15 19v-11"/><path d="M20 19V4"/></symbol>
</defs></svg>
<svg viewBox="0 0 160 80" width="260" height="130" style="position:absolute;left:560px;top:-50px;opacity:.16" aria-hidden="true"><use href="#cloudFlat"/></svg>
<div style="position:absolute;left:0;right:0;top:0;height:58px;display:flex;align-items:center;gap:14px;padding:0 20px;box-sizing:border-box">
<div class="mp" style="padding:4px 14px 6px;border-radius:12px;background:#FFF8EC;color:{{pc}};border:4px solid #231A3D;font-size:26px">{{label}}</div>
<svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-tilt"/></svg>
<span style="font-size:19px;font-weight:900">かたむけて うごく</span>
<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#ffffff" stroke-width="2.8" stroke-linecap="round" style="margin-left:auto" role="img" aria-label="つながっている"><use href="#i-signal"/></svg>
</div>

<div style="position:absolute;left:16px;right:16px;top:62px;bottom:20px;display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:16px">
<button class="pad {{aCls}}" style="background:#FFF8EC" onClick="{{pressA}}" aria-label="A たいあたり小">
<span class="mp ol" style="position:relative;font-size:150px;color:{{pc}}">A</span>
<span class="sub">
<svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="#231A3D" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
<span>ちょん!</span>
</span>
</button>
<button class="pad {{bCls}}" style="background:#FFC93C" onClick="{{pressB}}" aria-label="B たいあたり中">
<svg class="spin" viewBox="-120 -120 240 240" width="330" height="330" style="position:absolute" aria-hidden="true"><use href="#burstW" x="-120" y="-120" width="240" height="240"/></svg>
<span class="mp ol" style="position:relative;font-size:150px;color:#ffffff">B</span>
<span class="sub">
<svg viewBox="0 0 24 24" width="40" height="34" fill="none" stroke="#231A3D" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 5l7 7-7 7"/><path d="M12 5l7 7-7 7"/></svg>
<span>ドーン!</span>
</span>
<sc-if value="{{cooling}}" hint-placeholder-val="{{false}}">
<span style="position:absolute;inset:0;background:{{coolBg}}"></span>
<span class="mp ol" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:110px;color:#ffffff">{{coolSec}}</span>
</sc-if>
<sc-if value="{{ready}}" hint-placeholder-val="{{false}}">
<span class="ready" style="position:absolute;inset:0;border-radius:28px"></span>
</sc-if>
</button>
</div>

<sc-if value="{{hitFlash}}" hint-placeholder-val="{{false}}">
<div class="hit" style="position:absolute;inset:0;background:#ffffff"></div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"player":{"editor":"enum","options":["1P","2P"],"default":"2P"},"hitFlash":{"editor":"boolean","default":false},"$preview":{"width":844,"height":390}}'>
class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    this.state = { a: false, b: false, cool: 0, ready: false };
  }
  componentWillUnmount() {
    clearInterval(this.iv);
    clearTimeout(this.ta);
    clearTimeout(this.tb);
    clearTimeout(this.tr);
  }
  renderVals() {
    const s = this.state || {};
    const p2 = (this.props.player ?? '2P') === '2P';
    const cool = s.cool || 0;
    const deg = Math.round(cool * 360);
    return {
      pc: p2 ? '#E8284F' : '#2F6BFF',
      label: p2 ? '2P' : '1P',
      aCls: s.a ? 'pressed' : '',
      bCls: s.b ? 'pressed' : '',
      cooling: cool > 0,
      ready: !!s.ready,
      coolBg: 'conic-gradient(rgba(35,26,61,.72) 0deg ' + deg + 'deg, transparent ' + deg + 'deg 360deg)',
      coolSec: String(Math.max(1, Math.ceil(cool * 3))),
      hitFlash: this.props.hitFlash ?? false,
      pressA: () => {
        this.setState({ a: true });
        clearTimeout(this.ta);
        this.ta = setTimeout(() => this.setState({ a: false }), 140);
      },
      pressB: () => {
        if ((this.state && this.state.cool) > 0) return;
        this.setState({ b: true, ready: false, cool: 1 });
        clearTimeout(this.tb);
        this.tb = setTimeout(() => this.setState({ b: false }), 140);
        const start = Date.now();
        clearInterval(this.iv);
        this.iv = setInterval(() => {
          const r = 1 - (Date.now() - start) / 3000;
          if (r <= 0) {
            clearInterval(this.iv);
            this.setState({ cool: 0, ready: true });
            clearTimeout(this.tr);
            this.tr = setTimeout(() => this.setState({ ready: false }), 700);
          } else {
            this.setState({ cool: r });
          }
        }, 50);
      }
    };
  }
}
</script>
</body>
</html>
