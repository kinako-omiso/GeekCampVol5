body{margin:0;background:#8FDBFF}
.mp{font-family:'Mochiy Pop One',sans-serif;line-height:1.05}
.ol{-webkit-text-stroke:14px #231A3D;paint-order:stroke fill}
.ol-m{-webkit-text-stroke:10px #231A3D;paint-order:stroke fill}
.ol-s{-webkit-text-stroke:6px #231A3D;paint-order:stroke fill}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(1700px)}}
.drift{animation:drift 60s linear infinite}
@keyframes rays{to{transform:rotate(360deg)}}
.rays{animation:rays 50s linear infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-10px) rotate(-2deg)}}
.bob{animation:bob 2.6s ease-in-out infinite}
@keyframes bob2{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.bob2{animation:bob2 1.6s ease-in-out infinite}
@keyframes wave{0%,100%{transform:skewY(0deg)}50%{transform:skewY(-4deg)}}
.wave{animation:wave 1.2s ease-in-out infinite;transform-origin:15% 50%}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,.9)}100%{box-shadow:0 0 0 30px rgba(255,255,255,0)}}
.pulse{animation:pulse 1.4s ease-out infinite}
@keyframes stamp{0%{transform:scale(2.4) rotate(-22deg);opacity:0}60%{transform:scale(.9) rotate(-10deg);opacity:1}100%{transform:scale(1) rotate(-10deg);opacity:1}}
.stamp{animation:stamp .55s cubic-bezier(.2,1.5,.4,1) .3s both}
@keyframes blink{0%,100%{opacity:.4}50%{opacity:1}}
.blink{animation:blink 1.1s ease-in-out infinite}
.chip{position:relative;width:52px;height:52px;box-sizing:border-box;border-radius:50%;display:flex;align-items:center;justify-content:center}
.on{background:#FFF8EC;border:4px solid #231A3D}
.off{background:rgba(255,248,236,.35);border:4px dashed #7A5A3A}
.tick{position:absolute;right:-6px;top:-6px;width:24px;height:24px;box-sizing:border-box;border-radius:50%;background:#FFC93C;border:3px solid #231A3D;display:flex;align-items:center;justify-content:center}
</style>
