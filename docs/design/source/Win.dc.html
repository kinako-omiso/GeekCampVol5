body{margin:0;background:#8FDBFF}
.mp{font-family:'Mochiy Pop One',sans-serif;line-height:1.05}
.ol{-webkit-text-stroke:18px #231A3D;paint-order:stroke fill}

.ol-s{-webkit-text-stroke:6px #231A3D;paint-order:stroke fill}

.rays{animation:rays 22s linear infinite}
.spinSlow{animation:rays 16s linear infinite}
@keyframes glow{0%,100%{transform:scale(.92);opacity:.85}50%{transform:scale(1.08);opacity:1}}
.glow{animation:glow 1.6s ease-in-out infinite}
@keyframes beamL{0%,100%{transform:rotate(-34deg)}50%{transform:rotate(-8deg)}}
@keyframes beamR{0%,100%{transform:rotate(34deg)}50%{transform:rotate(8deg)}}
.beam{position:absolute;left:340px;top:-120px;width:240px;height:880px;transform-origin:50% 100%;background:linear-gradient(to top,rgba(255,255,255,.7),rgba(255,255,255,0) 88%);clip-path:polygon(44% 100%,56% 100%,100% 0,0 0)}
.beamL{animation:beamL 3.2s ease-in-out infinite}
.beamR{animation:beamR 3.2s ease-in-out infinite}
@keyframes fall{0%{transform:translateY(-60px) rotate(0) skewX(0)}50%{transform:translateY(360px) rotate(360deg) skewX(20deg)}100%{transform:translateY(800px) rotate(720deg) skewX(0)}}
.conf{position:absolute;top:0;animation:fall 4s linear infinite}
@keyframes fw{0%{transform:scale(.1);opacity:1}70%{opacity:1}100%{transform:scale(1.5);opacity:0}}
.fw{animation:fw 1.8s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes rise{0%{transform:translateY(420px)}10%{transform:translateY(-16px)}13%,95%{transform:translateY(0);opacity:1}100%{transform:translateY(0);opacity:0}}
.rise{animation:rise 7s ease-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.bob{animation:bob 1.4s ease-in-out infinite}
@keyframes crown{0%,12%{transform:translateY(-260px) rotate(-10deg);opacity:0}17%{transform:translateY(10px) rotate(-10deg);opacity:1}19%,95%{transform:translateY(0) rotate(-10deg);opacity:1}100%{transform:translateY(0) rotate(-10deg);opacity:0}}
.crown{animation:crown 7s ease-out infinite}
@keyframes flagIn{0%,16%{transform:translateY(180px);opacity:0}20%{transform:translateY(-10px);opacity:1}22%,95%{transform:translateY(0);opacity:1}100%{opacity:0}}
.flagIn{animation:flagIn 7s ease-out infinite}
@keyframes wave{0%,100%{transform:skewY(0deg)}50%{transform:skewY(-5deg)}}
.wave{animation:wave 1s ease-in-out infinite;transform-origin:15% 50%}
@keyframes kira{0%,19%{transform:scale(0) rotate(0);opacity:0}22%{transform:scale(1.3) rotate(45deg);opacity:1}28%{transform:scale(1) rotate(90deg);opacity:1}34%,100%{transform:scale(0) rotate(135deg);opacity:0}}
.kira{animation:kira 7s ease-out infinite}
@keyframes popIn{0%,4%{transform:scale(2.8) rotate(-5deg);opacity:0}9%{transform:scale(.9) rotate(-5deg);opacity:1}11%{transform:scale(1.05) rotate(-5deg)}13%,95%{transform:scale(1) rotate(-5deg);opacity:1}100%{transform:scale(1) rotate(-5deg);opacity:0}}
.popIn{animation:popIn 7s ease-out infinite both}
@keyframes popB{0%,3%{transform:scale(0) rotate(-40deg);opacity:0}9%{transform:scale(1.12) rotate(4deg);opacity:1}12%,95%{transform:scale(1) rotate(0);opacity:1}100%{transform:scale(1);opacity:0}}
.popB{animation:popB 7s ease-out infinite both}
@keyframes upIn{0%,22%{transform:translateY(60px);opacity:0}27%{transform:translateY(-6px);opacity:1}29%,95%{transform:translateY(0);opacity:1}100%{transform:translateY(0);opacity:0}}
.upIn{animation:upIn 7s ease-out infinite both}
@keyframes clap{0%,100%{transform:rotate(-8deg) scale(1)}50%{transform:rotate(8deg) scale(1.15)}}
.clap{animation:clap .4s ease-in-out infinite}
@keyframes flash{0%{opacity:.9}6%,100%{opacity:0}}
.flash{animation:flash 7s ease-out infinite;pointer-events:none}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
.d1{animation:blink 1.2s infinite}.d2{animation:blink 1.2s .2s infinite}.d3{animation:blink 1.2s .4s infinite}
@keyframes tw{0%,100%{transform:scale(0) rotate(0)}50%{transform:scale(1) rotate(90deg)}}
.tw{animation:tw 1.3s ease-in-out infinite}
</style>
