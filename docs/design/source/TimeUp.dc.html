<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>時間切れ 山くらべ</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&amp;family=M+PLUS+Rounded+1c:wght@500;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#8FDBFF}
.mp{font-family:'Mochiy Pop One',sans-serif;line-height:1.05}
.ol{-webkit-text-stroke:16px #231A3D;paint-order:stroke fill}
.ol-s{-webkit-text-stroke:6px #231A3D;paint-order:stroke fill}
@keyframes tu{0%{transform:translate(0,0) scale(3);opacity:0}3%{transform:translate(0,0) scale(.92);opacity:1}5%{transform:translate(0,0) scale(1.04)}6%{transform:translate(0,0) scale(1)}7%{transform:translate(-12px,6px) scale(1)}8%{transform:translate(10px,-6px) scale(1)}9%{transform:translate(-6px,4px) scale(1)}10%,28%{transform:translate(0,0) scale(1)}34%{transform:translate(0,-292px) scale(.48)}95%{transform:translate(0,-292px) scale(.48);opacity:1}100%{transform:translate(0,-292px) scale(.48);opacity:0}}
.tu{animation:tu 7s ease-out infinite}
@keyframes wob{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
.wob{animation:wob .25s linear infinite}
@keyframes flash{0%{opacity:0}2%{opacity:.9}8%,100%{opacity:0}}
.flash{animation:flash 7s linear infinite;pointer-events:none}
@keyframes riseL{0%,36%{transform:translateY(620px)}44%{transform:translateY(-12px)}46%,95%{transform:translateY(0);opacity:1}100%{transform:translateY(0);opacity:0}}
.riseL{animation:riseL 7s ease-out infinite}
@keyframes riseR{0%,40%{transform:translateY(620px)}48%{transform:translateY(-12px)}50%,95%{transform:translateY(0);opacity:1}100%{transform:translateY(0);opacity:0}}
.riseR{animation:riseR 7s ease-out infinite}
@keyframes cap{0%,36%{opacity:0;transform:translateY(10px)}40%,95%{opacity:1;transform:translateY(0)}100%{opacity:0}}
.cap{animation:cap 7s ease-out infinite}
@keyframes eA{0%,57%{opacity:1}58%,100%{opacity:0}}
.eA{animation:eA 7s linear infinite}
@keyframes eB{0%,57%{opacity:0}58%,100%{opacity:1}}
.eB{animation:eB 7s linear infinite}
@keyframes res{0%,56%{opacity:0}60%,95%{opacity:1}100%{opacity:0}}
.res{animation:res 7s linear infinite}
@keyframes crown{0%,56%{transform:translateY(-220px) rotate(-10deg);opacity:0}60%{transform:translateY(10px) rotate(-10deg);opacity:1}62%,95%{transform:translateY(0) rotate(-10deg);opacity:1}100%{transform:translateY(0) rotate(-10deg);opacity:0}}
.crown{animation:crown 7s ease-out infinite}
@keyframes stamp{0%,58%{transform:scale(2.6) rotate(-10deg);opacity:0}62%{transform:scale(.9) rotate(-10deg);opacity:1}64%,95%{transform:scale(1) rotate(-10deg);opacity:1}100%{transform:scale(1) rotate(-10deg);opacity:0}}
.stamp{animation:stamp 7s ease-out infinite}
@keyframes rays{to{transform:rotate(360deg)}}
.rays{animation:rays 24s linear infinite}
@keyframes rib{0%,56%{transform:scaleX(0) rotate(-3deg)}60%{transform:scaleX(1.06) rotate(-3deg)}62%,95%{transform:scaleX(1) rotate(-3deg);opacity:1}100%{transform:scaleX(1) rotate(-3deg);opacity:0}}
.rib{animation:rib 7s ease-out infinite}
@keyframes num{0%,44%{transform:scale(0)}48%{transform:scale(1.2)}50%,100%{transform:scale(1)}}
.num{animation:num 7s ease-out infinite}
.hp{position:absolute;left:112px;top:150px;width:136px;height:136px;box-sizing:border-box;border-radius:50%;background:#FFF8EC;border:6px solid #231A3D;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0}
</style>
</helmet>
<div style="width:1280px;height:720px;position:relative;overflow:hidden;background:#8FDBFF;font-family:'M PLUS Rounded 1c',sans-serif;color:#231A3D">
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<path id="mugP" d="M40 40H140V154Q140 170 124 170H56Q40 170 40 154ZM140 66H158Q182 66 182 96V112Q182 142 158 142H140V124H154Q164 124 164 112V96Q164 84 154 84H140Z"/>
<symbol id="mug" viewBox="0 0 220 200"><g stroke="#231A3D" stroke-width="10" stroke-linejoin="round"><use href="#mugP" transform="translate(18 -14)"/><use href="#mugP" transform="translate(9 -7)"/><use href="#mugP"/></g><use href="#mugP" transform="translate(18 -14)" fill="#77819F"/><use href="#mugP" transform="translate(15 -11.7)" fill="#828CAA"/><use href="#mugP" transform="translate(12 -9.3)" fill="#8D97B4"/><use href="#mugP" transform="translate(9 -7)" fill="#98A2BF"/><use href="#mugP" transform="translate(6 -4.7)" fill="#A3ACC9"/><use href="#mugP" transform="translate(3 -2.3)" fill="#AEB7D3"/><use href="#mugP" fill="#F4F6FC" stroke="#231A3D" stroke-width="4" stroke-linejoin="round"/><rect x="48" y="124" width="9" height="32" rx="4.5" fill="#ffffff"/></symbol>
<rect id="erB" x="16" y="78" width="170" height="72" rx="12"/>
<rect id="erS" x="80" y="72" width="112" height="84" rx="6"/>
<symbol id="eraser" viewBox="0 0 220 200"><g stroke="#231A3D" stroke-width="10" stroke-linejoin="round"><use href="#erB" transform="translate(18 -16)"/><use href="#erS" transform="translate(18 -16)"/><use href="#erB"/><use href="#erS"/></g><use href="#erB" transform="translate(18 -16)" fill="#A3AABD"/><use href="#erS" transform="translate(18 -16)" fill="#646D85"/><use href="#erB" transform="translate(15 -13.3)" fill="#A9B0C2"/><use href="#erS" transform="translate(15 -13.3)" fill="#6A738B"/><use href="#erB" transform="translate(12 -10.7)" fill="#AFB6C7"/><use href="#erS" transform="translate(12 -10.7)" fill="#707991"/><use href="#erB" transform="translate(9 -8)" fill="#B5BCCC"/><use href="#erS" transform="translate(9 -8)" fill="#767F97"/><use href="#erB" transform="translate(6 -5.3)" fill="#BBC2D1"/><use href="#erS" transform="translate(6 -5.3)" fill="#7C859D"/><use href="#erB" transform="translate(3 -2.7)" fill="#C1C8D6"/><use href="#erS" transform="translate(3 -2.7)" fill="#828BA3"/><use href="#erB" fill="#F7F8FB" stroke="#231A3D" stroke-width="4" stroke-linejoin="round"/><use href="#erS" fill="#A9B2C6" stroke="#231A3D" stroke-width="4" stroke-linejoin="round"/><rect x="82" y="102" width="108" height="16" fill="#3B4257"/></symbol>
<symbol id="eyes-r" viewBox="0 0 80 44"><g fill="#ffffff" stroke="#231A3D" stroke-width="4"><ellipse cx="20" cy="24" rx="13" ry="16"/><ellipse cx="60" cy="24" rx="13" ry="16"/></g><g fill="#231A3D"><circle cx="25" cy="25" r="7.5"/><circle cx="65" cy="25" r="7.5"/></g><g fill="#ffffff"><circle cx="27.5" cy="21.5" r="2.6"/><circle cx="67.5" cy="21.5" r="2.6"/></g></symbol>
<symbol id="eyes-l" viewBox="0 0 80 44"><g fill="#ffffff" stroke="#231A3D" stroke-width="4"><ellipse cx="20" cy="24" rx="13" ry="16"/><ellipse cx="60" cy="24" rx="13" ry="16"/></g><g fill="#231A3D"><circle cx="15" cy="25" r="7.5"/><circle cx="55" cy="25" r="7.5"/></g><g fill="#ffffff"><circle cx="17.5" cy="21.5" r="2.6"/><circle cx="57.5" cy="21.5" r="2.6"/></g></symbol>
<symbol id="eyes-happy" viewBox="0 0 80 44"><g fill="none" stroke="#231A3D" stroke-width="5.5" stroke-linecap="round"><path d="M8 30Q20 12 32 30"/><path d="M48 30Q60 12 72 30"/></g></symbol>
<symbol id="eyes-star" viewBox="0 0 80 44"><g fill="#ffffff" stroke="#231A3D" stroke-width="4"><ellipse cx="20" cy="24" rx="13" ry="16"/><ellipse cx="60" cy="24" rx="13" ry="16"/></g><g fill="#FFC93C" stroke="#231A3D" stroke-width="2" stroke-linejoin="round"><path d="M20 13l3 6.2 6.8.8-5 4.6 1.3 6.7L20 28l-6.1 3.3 1.3-6.7-5-4.6 6.8-.8z"/><path d="M60 13l3 6.2 6.8.8-5 4.6 1.3 6.7L60 28l-6.1 3.3 1.3-6.7-5-4.6 6.8-.8z"/></g></symbol>
<symbol id="eyes-sad" viewBox="0 0 80 44"><g fill="#ffffff" stroke="#231A3D" stroke-width="4"><ellipse cx="20" cy="27" rx="12" ry="14"/><ellipse cx="60" cy="27" rx="12" ry="14"/></g><g fill="#231A3D"><circle cx="20" cy="32" r="6.5"/><circle cx="60" cy="32" r="6.5"/></g><g stroke="#231A3D" stroke-width="5" stroke-linecap="round"><path d="M8 11L30 4"/><path d="M72 11L50 4"/></g></symbol>
<symbol id="cloud" viewBox="0 0 160 80"><path d="M24 74C8 74 3 54 17 47C13 29 35 20 48 30C54 11 85 7 95 26C107 16 129 22 129 41C147 41 156 62 141 74Z" fill="#ffffff" stroke="#231A3D" stroke-width="5" stroke-linejoin="round"/><path d="M28 66C60 70 110 70 136 64" fill="none" stroke="#DCEFFC" stroke-width="7" stroke-linecap="round"/></symbol>
<symbol id="crown" viewBox="0 0 170 130"><path d="M14 104L22 34L58 68L85 14L112 68L148 34L156 104Z" fill="#FFC93C" stroke="#231A3D" stroke-width="8" stroke-linejoin="round"/><rect x="12" y="98" width="146" height="24" rx="6" fill="#FF9F1C" stroke="#231A3D" stroke-width="8"/><g fill="#ffffff" stroke="#231A3D" stroke-width="5"><circle cx="22" cy="30" r="9"/><circle cx="85" cy="12" r="10"/><circle cx="148" cy="30" r="9"/></g></symbol>
<symbol id="mtnB" viewBox="0 0 360 560"><path d="M0 560L138 48Q180 20 222 48L360 560Z" fill="#9CC0FF" stroke="#231A3D" stroke-width="7" stroke-linejoin="round"/><path d="M186 30Q210 34 222 48L360 560H200Z" fill="#7DA5F5"/><path d="M0 560L138 48Q180 20 222 48L360 560" fill="none" stroke="#231A3D" stroke-width="7" stroke-linejoin="round"/><path d="M138 48Q180 20 222 48L248 142Q224 124 206 150Q184 124 162 148Q140 126 112 140Z" fill="#ffffff" stroke="#231A3D" stroke-width="6" stroke-linejoin="round"/></symbol>
<symbol id="mtnP" viewBox="0 0 360 560"><path d="M0 560L138 48Q180 20 222 48L360 560Z" fill="#FFA3B8" stroke="#231A3D" stroke-width="7" stroke-linejoin="round"/><path d="M186 30Q210 34 222 48L360 560H200Z" fill="#F4829D"/><path d="M0 560L138 48Q180 20 222 48L360 560" fill="none" stroke="#231A3D" stroke-width="7" stroke-linejoin="round"/><path d="M138 48Q180 20 222 48L248 142Q224 124 206 150Q184 124 162 148Q140 126 112 140Z" fill="#ffffff" stroke="#231A3D" stroke-width="6" stroke-linejoin="round"/></symbol>
<symbol id="heart" viewBox="0 0 24 24"><path d="M12 20.5s-8-4.9-8-10.6A4.4 4.4 0 0 1 12 7.2a4.4 4.4 0 0 1 8 2.7c0 5.7-8 10.6-8 10.6z"/></symbol>
</defs></svg>

<svg viewBox="0 0 1280 720" width="1280" height="720" style="position:absolute;inset:0" aria-hidden="true">
<path d="M0 470L110 380L210 430L330 330L460 420L560 370L690 440L810 340L950 430L1070 360L1180 410L1280 380V720H0Z" fill="#79C9EF"/>
</svg>
<div class="res" style="position:absolute;inset:0">
<div class="rays" style="position:absolute;left:{{raysL}};top:{{raysT}};width:2400px;height:2400px;background:repeating-conic-gradient(from 0deg,rgba(255,201,60,.4) 0deg 7deg,transparent 7deg 18deg)"></div>
</div>

<div class="riseL" style="position:absolute;left:200px;top:{{t1}};width:360px;height:560px">
<svg viewBox="0 0 360 560" width="360" height="560" style="position:absolute;inset:0" aria-hidden="true"><use href="#mtnB"/></svg>
<svg viewBox="0 0 220 200" width="190" height="173" style="position:absolute;left:84px;top:-107px" role="img" aria-label="1Pのコマ(マグカップの例)"><use href="#mug"/><use class="eA" href="#eyes-r" x="50" y="70" width="80" height="44"/><use class="eB" href="#{{e1}}" x="50" y="70" width="80" height="44"/></svg>
<div class="hp"><svg viewBox="0 0 24 24" width="34" height="34" aria-hidden="true"><use href="#heart" fill="#FFC93C" stroke="#231A3D" stroke-width="2.2" stroke-linejoin="round"/></svg><span class="mp num" style="font-size:56px">{{hp1}}</span></div>
<div class="mp ol-s" style="position:absolute;left:24px;top:330px;padding:2px 16px 6px;background:#2F6BFF;border:4px solid #231A3D;border-radius:12px;font-size:32px;color:#ffffff">1P</div>
</div>
<div class="riseR" style="position:absolute;left:720px;top:{{t2}};width:360px;height:560px">
<svg viewBox="0 0 360 560" width="360" height="560" style="position:absolute;inset:0" aria-hidden="true"><use href="#mtnP"/></svg>
<svg viewBox="0 0 220 200" width="200" height="182" style="position:absolute;left:72px;top:-114px" role="img" aria-label="2Pのコマ(消しゴムの例)"><use href="#eraser"/><use class="eA" href="#eyes-l" x="18" y="92" width="62" height="34"/><use class="eB" href="#{{e2}}" x="18" y="92" width="62" height="34"/></svg>
<div class="hp"><svg viewBox="0 0 24 24" width="34" height="34" aria-hidden="true"><use href="#heart" fill="#FFC93C" stroke="#231A3D" stroke-width="2.2" stroke-linejoin="round"/></svg><span class="mp num" style="font-size:56px">{{hp2}}</span></div>
<div class="mp ol-s" style="position:absolute;right:24px;top:330px;padding:2px 16px 6px;background:#E8284F;border:4px solid #231A3D;border-radius:12px;font-size:32px;color:#ffffff">2P</div>
</div>

<svg viewBox="0 0 1280 200" width="1280" height="200" style="position:absolute;left:0;top:548px" aria-hidden="true">
<path d="M-10 70Q30 18 80 44Q120 -2 180 30Q226 -10 280 26Q330 -8 386 28Q436 -4 490 30Q540 -6 596 26Q646 -8 700 28Q750 -4 806 30Q856 -8 910 26Q960 -4 1016 30Q1066 -8 1120 26Q1170 -2 1220 32Q1260 10 1292 42V210H-10Z" fill="#ffffff" stroke="#231A3D" stroke-width="5" stroke-linejoin="round"/>
<path d="M-10 130Q40 96 96 116Q150 84 210 110Q270 82 330 112Q390 86 450 114Q510 84 570 112Q630 86 690 114Q750 84 810 112Q870 86 930 114Q990 84 1050 112Q1110 86 1170 114Q1230 90 1292 110V210H-10Z" fill="#E4F4FF"/>
</svg>

<sc-if value="{{win}}" hint-placeholder-val="{{true}}">
<div class="crown" style="position:absolute;left:{{crownL}};top:{{crownT}};width:130px;height:100px"><svg viewBox="0 0 170 130" width="130" height="100" role="img" aria-label="おうかん"><use href="#crown"/></svg></div>
<div class="mp stamp" style="position:absolute;left:{{stampL}};top:{{stampT}};padding:12px 24px;background:#FFC93C;border:6px solid #231A3D;border-radius:18px;box-shadow:0 7px 0 #231A3D;font-size:50px">かち!</div>
</sc-if>


<div class="cap" style="position:absolute;left:0;right:0;top:122px;display:flex;justify-content:center">
<div class="mp" style="padding:8px 24px;background:#FFF8EC;border:5px solid #231A3D;border-radius:999px;box-shadow:0 5px 0 #231A3D;font-size:28px">たかい ほうが かち!</div>
</div>

<sc-if value="{{dr}}" hint-placeholder-val="{{false}}">
<div style="position:absolute;left:0;right:0;top:110px;display:flex;justify-content:center;z-index:2">
<div class="mp rib" style="padding:12px 44px 16px;background:#FFC93C;border:7px solid #231A3D;border-radius:22px;box-shadow:0 9px 0 #231A3D;font-size:62px;white-space:nowrap">ひきわけ!</div>
</div>
<div class="res" style="position:absolute;left:0;right:0;top:600px;display:flex;justify-content:center">
<div style="display:flex;align-items:center;gap:10px;padding:8px 22px;background:#FFF8EC;border:5px solid #231A3D;border-radius:999px;font-size:22px;font-weight:900">
<svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="#231A3D" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/></svg>
<span>スマホで つぎを えらんでね</span>
</div>
</div>
</sc-if>

<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none">
<div class="tu" style="display:flex;align-items:center;gap:20px">
<div class="wob" style="position:relative;width:150px;height:150px;flex-shrink:0">
<svg viewBox="-60 -60 120 120" width="150" height="150" style="position:absolute;inset:0" aria-hidden="true"><polygon points="0,-56 10.9,-40.6 28,-48.5 29.7,-29.7 48.5,-28 40.6,-10.9 56,0 40.6,10.9 48.5,28 29.7,29.7 28,48.5 10.9,40.6 0,56 -10.9,40.6 -28,48.5 -29.7,29.7 -48.5,28 -40.6,10.9 -56,0 -40.6,-10.9 -48.5,-28 -29.7,-29.7 -28,-48.5 -10.9,-40.6" fill="#FF9F1C" stroke="#231A3D" stroke-width="4.5" stroke-linejoin="round"/><circle r="37" fill="#FFE27A" stroke="#231A3D" stroke-width="4.5"/></svg>
<div class="mp" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:62px;padding-top:4px" aria-label="のこり0びょう">0</div>
</div>
<div class="mp ol" style="font-size:118px;color:#FFC93C;text-shadow:0 10px 0 #231A3D;white-space:nowrap">タイムアップ!</div>
</div>
</div>
<div class="flash" style="position:absolute;inset:0;background:#ffffff"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"result":{"editor":"enum","options":["1Pのかち","2Pのかち","ひきわけ"],"default":"1Pのかち"},"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    const r = this.props.result ?? '1Pのかち';
    const w1 = r === '1Pのかち';
    const w2 = r === '2Pのかち';
    const dr = !w1 && !w2;
    const hp1 = w1 ? 38 : w2 ? 21 : 30;
    const hp2 = w1 ? 21 : w2 ? 38 : 30;
    const peak1 = Math.round(600 - hp1 * 8.5);
    const peak2 = Math.round(600 - hp2 * 8.5);
    const cx = w2 ? 900 : 380;
    const pk = w2 ? peak2 : peak1;
    return {
      win: !dr,
      dr: dr,
      hp1: String(hp1),
      hp2: String(hp2),
      t1: (peak1 - 34) + 'px',
      t2: (peak2 - 34) + 'px',
      e1: w1 ? 'eyes-star' : w2 ? 'eyes-sad' : 'eyes-happy',
      e2: w2 ? 'eyes-star' : w1 ? 'eyes-sad' : 'eyes-happy',
      crownL: (cx - 65) + 'px',
      crownT: (pk - 185) + 'px',
      stampL: (w2 ? cx - 320 : cx + 110) + 'px',
      stampT: (pk - 40) + 'px',
      raysL: ((dr ? 640 : cx) - 1200) + 'px',
      raysT: ((dr ? 300 : pk - 40) - 1200) + 'px'
    };
  }
}
</script>
</body>
</html>
