<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>スマホ スキャン</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&amp;family=M+PLUS+Rounded+1c:wght@500;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#231A3D}
.mp{font-family:'Mochiy Pop One',sans-serif;line-height:1.05}
.ol{-webkit-text-stroke:12px #231A3D;paint-order:stroke fill}
.ol-s{-webkit-text-stroke:6px #231A3D;paint-order:stroke fill}
.side{display:flex;align-items:center;justify-content:center;box-sizing:border-box;border:6px solid #231A3D;border-radius:24px;cursor:pointer;padding:0;font-family:inherit;color:#231A3D}
.side:active{transform:translateY(6px)}
.seg{display:flex;align-items:center;gap:6px;height:46px;padding:0 18px;border:none;border-radius:999px;font-family:inherit;font-size:20px;font-weight:900;cursor:pointer}
.tip{display:flex;align-items:center;gap:6px;padding:5px 12px 5px 8px;background:#FFF8EC;border:4px solid #231A3D;border-radius:999px;font-size:17px;font-weight:900;color:#231A3D}
.shutter{position:relative;width:150px;height:150px;box-sizing:border-box;border-radius:50%;background:#FFF8EC;border:7px solid #231A3D;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.shutter:active{transform:scale(.94)}
@keyframes ants{to{stroke-dashoffset:-28}}
.ants{animation:ants .8s linear infinite}
@keyframes breathe{0%,100%{opacity:.45}50%{opacity:.7}}
.breathe{animation:breathe 1.4s ease-in-out infinite}
@keyframes draw{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
.draw{stroke-dasharray:900;animation:draw 2.4s ease-in-out infinite alternate}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-5px) rotate(-3deg)}}
.bob{animation:bob 1.4s ease-in-out infinite}
@keyframes glow{0%{box-shadow:0 8px 0 #231A3D,0 0 0 0 rgba(255,201,60,.9)}100%{box-shadow:0 8px 0 #231A3D,0 0 0 18px rgba(255,201,60,0)}}
.glow{animation:glow 1.2s ease-out infinite}
@keyframes ring{0%{box-shadow:0 8px 0 #231A3D,0 0 0 0 rgba(255,255,255,.9)}100%{box-shadow:0 8px 0 #231A3D,0 0 0 20px rgba(255,255,255,0)}}
.ringPulse{animation:ring 1.3s ease-out infinite}
@keyframes guide{0%,100%{opacity:.6}50%{opacity:1}}
.guide{animation:guide 1.4s ease-in-out infinite}
@keyframes up{0%{transform:translateY(12px);opacity:.3}50%{opacity:1}100%{transform:translateY(-12px);opacity:.3}}
.up{animation:up .8s ease-in-out infinite}
@keyframes prog{from{width:0}to{width:100%}}
.prog{animation:prog 1.6s ease-in-out both}
@keyframes pop{0%{transform:scale(0) rotate(-20deg)}70%{transform:scale(1.12) rotate(4deg)}100%{transform:scale(1) rotate(0)}}
.pop{animation:pop .5s cubic-bezier(.2,1.5,.4,1) both}
@keyframes flash{from{opacity:.95}to{opacity:0}}
.flash{animation:flash .35s ease-out both;pointer-events:none}
</style>
</helmet>
<div style="width:844px;height:390px;position:relative;overflow:hidden;background:#231A3D;font-family:'M PLUS Rounded 1c',sans-serif;color:#231A3D">
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<path id="mugP" d="M40 40H140V154Q140 170 124 170H56Q40 170 40 154ZM140 66H158Q182 66 182 96V112Q182 142 158 142H140V124H154Q164 124 164 112V96Q164 84 154 84H140Z"/>
<symbol id="photoMug" viewBox="0 0 220 200"><use href="#mugP" transform="translate(18 -14)" fill="#8F97AE"/><use href="#mugP" transform="translate(12 -9.3)" fill="#A3AABF"/><use href="#mugP" transform="translate(6 -4.7)" fill="#B7BDCF"/><use href="#mugP" fill="#E9ECF3"/><rect x="52" y="54" width="11" height="92" rx="5.5" fill="#ffffff"/></symbol>
<symbol id="mugMask" viewBox="0 0 220 200"><use href="#mugP" transform="translate(18 -14)"/><use href="#mugP" transform="translate(12 -9.3)"/><use href="#mugP" transform="translate(6 -4.7)"/><use href="#mugP"/></symbol>
<rect id="erB" x="16" y="78" width="170" height="72" rx="12"/>
<rect id="erS" x="80" y="72" width="112" height="84" rx="6"/>
<symbol id="photoEraser" viewBox="0 0 220 200"><use href="#erB" transform="translate(18 -16)" fill="#B3B9C8"/><use href="#erS" transform="translate(18 -16)" fill="#606A82"/><use href="#erB" transform="translate(12 -10.7)" fill="#C2C7D4"/><use href="#erS" transform="translate(12 -10.7)" fill="#6C7690"/><use href="#erB" transform="translate(6 -5.3)" fill="#D1D5DF"/><use href="#erS" transform="translate(6 -5.3)" fill="#78829B"/><use href="#erB" fill="#F3F4F8"/><use href="#erS" fill="#A2ABC0"/><rect x="80" y="102" width="112" height="16" fill="#3B4257"/></symbol>
<symbol id="eraserMask" viewBox="0 0 220 200"><use href="#erB" transform="translate(18 -16)"/><use href="#erS" transform="translate(18 -16)"/><use href="#erB" transform="translate(12 -10.7)"/><use href="#erS" transform="translate(12 -10.7)"/><use href="#erB" transform="translate(6 -5.3)"/><use href="#erS" transform="translate(6 -5.3)"/><use href="#erB"/><use href="#erS"/></symbol>
<symbol id="i-box" viewBox="0 0 24 24"><path d="M3.5 7.5L12 3l8.5 4.5v9L12 21l-8.5-4.5z"/><path d="M3.5 7.5L12 12l8.5-4.5"/><path d="M12 12v9"/></symbol>
<symbol id="i-bright" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5V5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></symbol>
<symbol id="i-frame" viewBox="0 0 24 24"><path d="M4 9V4h5"/><path d="M15 4h5v5"/><path d="M20 15v5h-5"/><path d="M9 20H4v-5"/><circle cx="12" cy="12" r="2.5"/></symbol>
<symbol id="i-camera" viewBox="0 0 24 24"><path d="M3 8.5A2.5 2.5 0 0 1 5.5 6H8l1.5-2h5L16 6h2.5A2.5 2.5 0 0 1 21 8.5v9a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z"/><circle cx="12" cy="13" r="3.5"/></symbol>
<symbol id="i-brush" viewBox="0 0 24 24"><path d="M4 20c2.5 0 4-1.3 4-3.5a2.5 2.5 0 0 0-2.5-2.5C3.5 14 3 16 3 17.5 3 19 2.5 20 2 20z"/><path d="M8.5 13.5L19.5 2.5l2 2-11 11"/></symbol>
<symbol id="i-hand" viewBox="0 0 24 24"><path d="M9 11V5a1.8 1.8 0 0 1 3.6 0v5"/><path d="M12.6 10V8.8a1.8 1.8 0 0 1 3.6 0V11"/><path d="M16.2 10.6a1.8 1.8 0 0 1 3.6 0V15a7 7 0 0 1-7 7h-.6a6.5 6.5 0 0 1-5.2-2.6L3.8 15.6a1.8 1.8 0 0 1 2.8-2.2L9 15.5"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
<symbol id="i-retry" viewBox="0 0 24 24"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3"/><path d="M4 3.5v4h4"/></symbol>
<symbol id="i-send" viewBox="0 0 24 24"><path d="M12 18V5"/><path d="M6.5 10.5L12 5l5.5 5.5"/><path d="M5 21h14"/></symbol>
<symbol id="i-monitor" viewBox="0 0 24 24"><rect x="2.5" y="4" width="19" height="12.5" rx="2"/><path d="M8.5 21h7"/><path d="M12 16.5V21"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14"/><path d="M5 12h14"/></symbol>
<symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
</defs></svg>

<div style="position:absolute;left:0;top:0;width:612px;height:390px;overflow:hidden;background:#CFC7BA">
<div style="position:absolute;left:0;right:0;top:252px;bottom:0;background:#8C6B52"></div>
<div style="position:absolute;left:0;right:0;top:248px;height:8px;background:#6F5340"></div>
<div style="position:absolute;left:180px;top:284px;width:270px;height:34px;border-radius:50%;background:rgba(40,28,20,.35)"></div>
<sc-if value="{{isP1}}" hint-placeholder-val="{{true}}"><svg viewBox="0 0 220 200" width="300" height="273" style="position:absolute;left:160px;top:76px" aria-hidden="true"><use href="#photoMug"/></svg></sc-if>
<sc-if value="{{isP2}}" hint-placeholder-val="{{false}}"><svg viewBox="0 0 220 200" width="320" height="291" style="position:absolute;left:142px;top:70px" aria-hidden="true"><use href="#photoEraser"/></svg></sc-if>

<sc-if value="{{shoot}}" hint-placeholder-val="{{true}}">
<div class="guide" style="position:absolute;left:112px;top:70px;width:396px;height:296px;box-sizing:border-box;border:6px dashed #ffffff;border-radius:34px"></div>
<div style="position:absolute;left:16px;top:14px;display:flex;gap:8px">
<div class="tip"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#231A3D" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-box"/></svg><span>1こだけ</span></div>
<div class="tip"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#231A3D" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-bright"/></svg><span>あかるく</span></div>
<div class="tip"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#231A3D" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-frame"/></svg><span>まるごと</span></div>
</div>
</sc-if>

<sc-if value="{{paint}}" hint-placeholder-val="{{false}}">
<sc-if value="{{isP1}}" hint-placeholder-val="{{true}}">
<svg class="breathe" viewBox="0 0 220 200" width="300" height="273" style="position:absolute;left:160px;top:76px;color:{{pc}};filter:drop-shadow(0 0 8px #ffffff)" aria-hidden="true"><use href="#mugMask" fill="currentColor"/></svg>
<svg viewBox="0 0 220 200" width="300" height="273" style="position:absolute;left:160px;top:76px" role="img" aria-label="ぬったところが ひかる"><use class="ants" href="#mugP" fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="8 6" stroke-linejoin="round"/><path class="draw" d="M70 150C58 112 88 78 108 100S150 62 138 110S98 152 128 150S172 112 158 78" fill="none" stroke="rgba(255,255,255,.85)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/></svg>
<div style="position:absolute;left:350px;top:152px;width:58px;height:58px;box-sizing:border-box;border-radius:50%;background:#FFF8EC;border:5px solid #231A3D;display:flex;align-items:center;justify-content:center" aria-hidden="true"><svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="{{pc}}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><use href="#i-hand"/></svg></div>
</sc-if>
<sc-if value="{{isP2}}" hint-placeholder-val="{{false}}">
<svg class="breathe" viewBox="0 0 220 200" width="320" height="291" style="position:absolute;left:142px;top:70px;color:{{pc}};filter:drop-shadow(0 0 8px #ffffff)" aria-hidden="true"><use href="#eraserMask" fill="currentColor"/></svg>
<svg viewBox="0 0 220 200" width="320" height="291" style="position:absolute;left:142px;top:70px" role="img" aria-label="ぬったところが ひかる"><use class="ants" href="#erB" fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="8 6"/><use class="ants" href="#erS" fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="8 6"/><path class="draw" d="M40 130C36 100 70 92 88 112S130 84 128 118S96 146 132 138S176 104 170 90" fill="none" stroke="rgba(255,255,255,.85)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/></svg>
<div style="position:absolute;left:360px;top:172px;width:58px;height:58px;box-sizing:border-box;border-radius:50%;background:#FFF8EC;border:5px solid #231A3D;display:flex;align-items:center;justify-content:center" aria-hidden="true"><svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="{{pc}}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><use href="#i-hand"/></svg></div>
</sc-if>
<div class="bob" style="position:absolute;left:24px;top:22px;display:flex;align-items:center;gap:10px;padding:8px 20px 8px 12px;background:#FFC93C;border:5px solid #231A3D;border-radius:999px;box-shadow:0 5px 0 #231A3D">
<svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="#231A3D" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-brush"/></svg>
<span class="mp" style="font-size:26px">ぬりぬり してね</span>
</div>
<div style="position:absolute;left:24px;bottom:22px;display:flex;gap:4px;padding:5px;background:#FFF8EC;border:5px solid #231A3D;border-radius:999px">
<button class="seg" style="background:{{addBg}};color:{{addFg}}" onClick="{{setAdd}}" aria-label="ぬる(ついか)"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" aria-hidden="true"><use href="#i-plus"/></svg><span>ぬる</span></button>
<button class="seg" style="background:{{subBg}};color:{{subFg}}" onClick="{{setSub}}" aria-label="けす(のぞく)"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" aria-hidden="true"><use href="#i-minus"/></svg><span>けす</span></button>
</div>
</sc-if>
</div>

<div style="position:absolute;left:612px;top:0;width:232px;height:390px;box-sizing:border-box;background-color:{{pc}};border-left:6px solid #231A3D;display:flex;flex-direction:column;align-items:center;gap:12px;padding:14px 16px">
<div class="mp ol-s" style="font-size:40px;color:#ffffff">{{label}}</div>
<sc-if value="{{shoot}}" hint-placeholder-val="{{true}}">
<button class="shutter ringPulse" onClick="{{snap}}" aria-label="しゃしんを とる">
<span style="position:absolute;inset:6px;box-sizing:border-box;border-radius:50%;border:10px solid {{pc}}"></span>
<svg viewBox="0 0 24 24" width="66" height="66" fill="none" stroke="#231A3D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-camera"/></svg>
</button>
<div class="mp ol-s" style="font-size:28px;color:#ffffff">パシャ!</div>
<a class="side" href="PhonePreset.dc.html" style="gap:8px;width:190px;height:52px;background:transparent;border:4px dashed rgba(255,255,255,.85);color:#ffffff;font-size:20px;font-weight:900;text-decoration:none" aria-label="おてほんから えらぶ"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-box"/></svg><span>おてほん</span></a>
</sc-if>
<sc-if value="{{paint}}" hint-placeholder-val="{{false}}">
<button class="side glow" style="flex-direction:column;gap:4px;width:190px;height:150px;background:#FFC93C" onClick="{{send}}" aria-label="これで おくる">
<svg viewBox="0 0 24 24" width="62" height="62" fill="none" stroke="#231A3D" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-check"/></svg>
<span class="mp" style="font-size:44px">OK!</span>
</button>
<button class="side" style="gap:8px;width:190px;height:64px;background:#FFF8EC;box-shadow:0 6px 0 #231A3D;font-size:22px;font-weight:900" onClick="{{retake}}" aria-label="とりなおす"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#231A3D" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-retry"/></svg><span>とりなおす</span></button>
<a class="side" href="PhonePreset.dc.html" style="gap:8px;width:190px;height:50px;background:transparent;border:4px dashed rgba(255,255,255,.85);color:#ffffff;font-size:20px;font-weight:900;text-decoration:none" aria-label="おてほんから えらぶ"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-box"/></svg><span>おてほん</span></a>
</sc-if>
</div>

<sc-if value="{{flashOn}}" hint-placeholder-val="{{false}}">
<div class="flash" style="position:absolute;inset:0;background:#ffffff"></div>
</sc-if>

<sc-if value="{{sending}}" hint-placeholder-val="{{false}}">
<div style="position:absolute;inset:0;background:rgba(35,26,61,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;color:#ffffff">
<svg class="up" viewBox="0 0 24 24" width="92" height="92" fill="none" stroke="#FFC93C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-send"/></svg>
<div class="mp" style="font-size:46px">おくってるよ…</div>
<div style="width:440px;height:30px;box-sizing:border-box;border:5px solid #FFF8EC;border-radius:999px;overflow:hidden"><div class="prog" style="height:100%;background:#FFC93C"></div></div>
</div>
</sc-if>

<sc-if value="{{sent}}" hint-placeholder-val="{{false}}">
<div style="position:absolute;inset:0;background-color:{{pc}};display:flex;align-items:center;justify-content:center;gap:40px;color:#ffffff">
<div class="pop" style="width:170px;height:170px;box-sizing:border-box;border-radius:50%;background:#FFC93C;border:8px solid #231A3D;box-shadow:0 10px 0 #231A3D;display:flex;align-items:center;justify-content:center">
<svg viewBox="0 0 24 24" width="108" height="108" fill="none" stroke="#231A3D" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-check"/></svg>
</div>
<div style="display:flex;flex-direction:column;gap:16px">
<div class="mp ol" style="font-size:84px;color:#FFC93C">おくったよ!</div>
<div style="display:flex;align-items:center;gap:12px;font-size:32px;font-weight:900">
<svg viewBox="0 0 24 24" width="46" height="46" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-monitor"/></svg>
<span>PCを みてね!</span>
</div>
</div>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"player":{"editor":"enum","options":["1P","2P"],"default":"1P"},"$preview":{"width":844,"height":390}}'>
class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    this.state = { step: 0, mode: 'add', flash: false };
  }
  componentWillUnmount() {
    clearTimeout(this.t1);
    clearTimeout(this.t2);
    clearTimeout(this.tf);
  }
  renderVals() {
    const s = this.state || {};
    const step = s.step || 0;
    const add = (s.mode || 'add') === 'add';
    const p2 = (this.props.player ?? '1P') === '2P';
    const pc = p2 ? '#E8284F' : '#2F6BFF';
    return {
      pc: pc,
      label: p2 ? '2P' : '1P',
      isP1: !p2,
      isP2: p2,
      shoot: step === 0,
      paint: step === 1,
      sending: step === 2,
      sent: step === 3,
      flashOn: !!s.flash,
      addBg: add ? pc : 'transparent',
      addFg: add ? '#ffffff' : '#231A3D',
      subBg: add ? 'transparent' : '#231A3D',
      subFg: add ? '#231A3D' : '#ffffff',
      setAdd: () => this.setState({ mode: 'add' }),
      setSub: () => this.setState({ mode: 'sub' }),
      snap: () => {
        clearTimeout(this.tf);
        this.setState({ step: 1, flash: true });
        this.tf = setTimeout(() => this.setState({ flash: false }), 380);
      },
      retake: () => this.setState({ step: 0 }),
      send: () => {
        clearTimeout(this.t1);
        clearTimeout(this.t2);
        this.setState({ step: 2 });
        this.t1 = setTimeout(() => {
          this.setState({ step: 3 });
          this.t2 = setTimeout(() => this.setState({ step: 0 }), 2600);
        }, 1700);
      }
    };
  }
}
</script>
</body>
</html>
