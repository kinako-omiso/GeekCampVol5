<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>スマホ 接続</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&amp;family=M+PLUS+Rounded+1c:wght@500;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#231A3D}
.mp{font-family:'Mochiy Pop One',sans-serif;line-height:1.05}
.ol{-webkit-text-stroke:12px #231A3D;paint-order:stroke fill}
.ol-s{-webkit-text-stroke:6px #231A3D;paint-order:stroke fill}
.big{display:flex;align-items:center;justify-content:center;gap:16px;width:470px;height:210px;box-sizing:border-box;background:#FFF8EC;border:7px solid #231A3D;border-radius:40px;box-shadow:0 12px 0 #231A3D;cursor:pointer;padding:0;font-family:inherit}
.big:active{transform:translateY(8px);box-shadow:0 4px 0 #231A3D}
@keyframes pulse{0%{box-shadow:0 12px 0 #231A3D,0 0 0 0 rgba(255,255,255,.9)}100%{box-shadow:0 12px 0 #231A3D,0 0 0 26px rgba(255,255,255,0)}}
.pulse{animation:pulse 1.3s ease-out infinite}
@keyframes tap{0%,100%{transform:translateY(0) scale(1)}40%{transform:translateY(6px) scale(.92)}}
.tap{animation:tap 1.3s ease-in-out infinite}
@keyframes level{0%{transform:translateX(-150px)}55%{transform:translateX(18px)}75%{transform:translateX(-6px)}100%{transform:translateX(0)}}
.level{animation:level 1.2s ease-out both}
@keyframes fillbar{from{width:0}to{width:100%}}
.fillbar{animation:fillbar 1.2s linear both}
@keyframes pop{0%{transform:scale(0) rotate(-20deg)}70%{transform:scale(1.12) rotate(4deg)}100%{transform:scale(1) rotate(0)}}
.pop{animation:pop .5s cubic-bezier(.2,1.5,.4,1) both}
</style>
</helmet>
<div style="width:844px;height:390px;position:relative;overflow:hidden;background-color:{{pc}};font-family:'M PLUS Rounded 1c',sans-serif;color:#ffffff">
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="cloudFlat" viewBox="0 0 160 80"><path d="M24 74C8 74 3 54 17 47C13 29 35 20 48 30C54 11 85 7 95 26C107 16 129 22 129 41C147 41 156 62 141 74Z" fill="#ffffff"/></symbol>
<symbol id="i-hand" viewBox="0 0 24 24"><path d="M9 11V5a1.8 1.8 0 0 1 3.6 0v5"/><path d="M12.6 10V8.8a1.8 1.8 0 0 1 3.6 0V11"/><path d="M16.2 10.6a1.8 1.8 0 0 1 3.6 0V15a7 7 0 0 1-7 7h-.6a6.5 6.5 0 0 1-5.2-2.6L3.8 15.6a1.8 1.8 0 0 1 2.8-2.2L9 15.5"/></symbol>
<symbol id="i-land" viewBox="0 0 24 24"><rect x="2.5" y="6.5" width="19" height="11" rx="2.2"/><path d="M18.5 11v2"/></symbol>
<symbol id="i-monitor" viewBox="0 0 24 24"><rect x="2.5" y="4" width="19" height="12.5" rx="2"/><path d="M8.5 21h7"/><path d="M12 16.5V21"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
<symbol id="i-signal" viewBox="0 0 24 24"><path d="M5 19v-3"/><path d="M10 19v-7"/><path d="M15 19v-11"/><path d="M20 19V4"/></symbol>
</defs></svg>
<svg viewBox="0 0 160 80" width="320" height="160" style="position:absolute;left:-80px;top:260px;opacity:.16" aria-hidden="true"><use href="#cloudFlat"/></svg>
<svg viewBox="0 0 160 80" width="260" height="130" style="position:absolute;left:620px;top:-40px;opacity:.16" aria-hidden="true"><use href="#cloudFlat"/></svg>
<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#ffffff" stroke-width="2.8" stroke-linecap="round" style="position:absolute;right:20px;top:16px" role="img" aria-label="つながっている"><use href="#i-signal"/></svg>

<sc-if value="{{s0}}" hint-placeholder-val="{{true}}">
<div style="position:absolute;inset:0;display:flex;align-items:center;gap:28px;padding:0 34px">
<div style="width:250px;display:flex;flex-direction:column;align-items:center;gap:4px;flex-shrink:0">
<div class="mp" style="font-size:28px">きみは</div>
<div class="mp ol" style="font-size:140px;color:#ffffff;text-shadow:0 10px 0 {{pcDark}}">{{label}}</div>
</div>
<div style="flex-grow:1;display:flex;flex-direction:column;align-items:center;gap:18px">
<button class="big pulse" onClick="{{start}}" aria-label="センサーをオンにする">
<svg class="tap" viewBox="0 0 24 24" width="78" height="78" fill="none" stroke="{{pc}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-hand"/></svg>
<span class="mp" style="font-size:68px;color:{{pc}}">タッチ!</span>
</button>
<div style="display:flex;align-items:center;gap:10px;font-size:21px;font-weight:900">
<span style="padding:4px 14px;border-radius:10px;background:#FFF8EC;color:#231A3D;border:3px solid #231A3D">許可</span>
<span>が でたら おしてね</span>
</div>
</div>
</div>
</sc-if>

<sc-if value="{{s1}}" hint-placeholder-val="{{false}}">
<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px">
<div style="display:flex;align-items:center;gap:16px">
<svg viewBox="0 0 24 24" width="64" height="64" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-land"/></svg>
<div class="mp ol" style="font-size:56px;color:#ffffff">よこもちで じっと…</div>
</div>
<div style="position:relative;width:480px;height:100px;box-sizing:border-box;background:#FFF8EC;border:7px solid #231A3D;border-radius:999px;box-shadow:0 9px 0 #231A3D;display:flex;align-items:center;justify-content:center" role="img" aria-label="すいじゅんき。まんなかに きたら OK">
<div style="position:absolute;left:198px;top:10px;width:6px;height:66px;background:#231A3D;border-radius:3px"></div>
<div style="position:absolute;right:198px;top:10px;width:6px;height:66px;background:#231A3D;border-radius:3px"></div>
<div class="level" style="width:74px;height:74px;box-sizing:border-box;border-radius:50%;background:#B8F0B8;border:6px solid #231A3D;position:relative"><div style="position:absolute;left:12px;top:10px;width:16px;height:12px;border-radius:50%;background:#ffffff"></div></div>
</div>
<div style="width:480px;height:18px;box-sizing:border-box;border:4px solid #231A3D;border-radius:999px;background:rgba(255,255,255,.3);overflow:hidden"><div class="fillbar" style="height:100%;background:#FFC93C"></div></div>
</div>
</sc-if>

<sc-if value="{{s2}}" hint-placeholder-val="{{false}}">
<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:40px">
<div class="pop" style="width:190px;height:190px;box-sizing:border-box;border-radius:50%;background:#FFC93C;border:8px solid #231A3D;box-shadow:0 10px 0 #231A3D;display:flex;align-items:center;justify-content:center">
<svg viewBox="0 0 24 24" width="120" height="120" fill="none" stroke="#231A3D" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-check"/></svg>
</div>
<div style="display:flex;flex-direction:column;gap:16px">
<div class="mp ol" style="font-size:120px;color:#FFC93C">OK!</div>
<div style="display:flex;align-items:center;gap:12px;font-size:32px;font-weight:900">
<svg viewBox="0 0 24 24" width="46" height="46" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-monitor"/></svg>
<span>PCを みてね!</span>
</div>
</div>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"player":{"editor":"enum","options":["1P","2P"],"default":"1P"},"$preview":{"width":844,"height":390}}'>
class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    this.state = { stage: 0 };
  }
  componentWillUnmount() {
    clearTimeout(this.t1);
    clearTimeout(this.t2);
  }
  renderVals() {
    const st = (this.state && this.state.stage) || 0;
    const p2 = (this.props.player ?? '1P') === '2P';
    return {
      pc: p2 ? '#E8284F' : '#2F6BFF',
      pcDark: p2 ? '#9E1233' : '#1B3FA8',
      label: p2 ? '2P' : '1P',
      s0: st === 0,
      s1: st === 1,
      s2: st === 2,
      start: () => {
        clearTimeout(this.t1);
        clearTimeout(this.t2);
        this.setState({ stage: 1 });
        this.t1 = setTimeout(() => {
          this.setState({ stage: 2 });
          this.t2 = setTimeout(() => this.setState({ stage: 0 }), 2800);
        }, 1400);
      }
    };
  }
}
</script>
</body>
</html>
